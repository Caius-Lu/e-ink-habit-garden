; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env]
framework = arduino
upload_speed = 460800
monitor_speed = 115200
monitor_filters = send_on_enter, log2file, time, esp32_exception_decoder
monitor_echo = true
monitor_eol = LF
lib_deps = 
	zinggjm/GxEPD2
	olikraus/U8g2_for_Adafruit_GFX
	https://github.com/tzapu/WiFiManager.git
	mathertel/OneButton
	bblanchon/ArduinoJson@^7.4.0

[env:esp32]
platform = espressif32
board = esp-wrover-kit
lib_ignore = gpio16
board_build.partitions = partitions_dashboard.csv
build_flags = 
	-D ESP32
	-D DASHBOARD ; 仪表盘模式：天气+待办+AI用量+GitHub+名言
	;-D E_INK_750 ; 微雪 7.5 寸墨水屏 第二、三代 800*480 
	; -D E_INK_750_V1 ; 微雪 7.5 寸墨水屏 第一代 640*384
	-D E_INK_750_GOOD ;GDEW075Z08  Good Display 7.5 寸三色墨水屏 800*480
	-D BUTTON_PIN=16

[env:esp32_classic]
platform = espressif32
board = esp-wrover-kit
lib_ignore = gpio16
build_flags = 
	-D ESP32
	;-D E_INK_750
	-D E_INK_750_GOOD
	-D BUTTON_PIN=16

[env:esp8266]
platform = espressif8266
board = esp12e
framework = arduino
extra_scripts = pre:scripts/patch_fpc8612.py
board_build.ldscript = eagle.flash.4m1m.ld ; 1MB 文件系统，应用空间最大化（装中文字库）
build_flags =
  -D ESP8266
	-D DASHBOARD ; 仪表盘模式
	-D E_INK_750
	; -D E_INK_750_V1
	; -D E_INK_290
	-D BUTTON_PIN=16
	-include src/esp8266_compat.h

[env:esp8266_classic]
platform = espressif8266
board = esp12e
framework = arduino
build_flags =
  -D ESP8266
	-D E_INK_750
	-D BUTTON_PIN=16

[env:native]
platform = native
framework =
lib_deps = throwtheswitch/Unity@^2.6.0
test_framework = unity
test_build_src = no
